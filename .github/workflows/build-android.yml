name: Build Android Geode mod

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Android64 .geode package
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: latest
          cli: latest

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: gd-ai-assistant-android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
